name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      # The suite is headless: no display server is available on the runner.
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libglib2.0-0 libxcb-cursor0

      - name: Install FarFieldSpherical from source
        # The viewer tracks the library closely, so CI builds against its
        # default branch rather than the last release on PyPI.
        run: |
          pip install "git+https://github.com/FreeSpaceMind/FarFieldSpherical.git"

      - name: Install package and dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Lint for errors and undefined names
        run: |
          pip install flake8
          python -m flake8 src/ tests/ --select=E9,F63,F7,F82,F821 --show-source
